# CodeRabbit Configuration
# https://docs.coderabbit.ai/guides/configure-coderabbit

language: "en-US"

reviews:
  # Review profile: chill, assertive, or auto
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    # Don't auto-review draft PRs
    drafts: false
    base_branches:
      - main
      - develop

  # Files to ignore in reviews
  path_filters:
    - "!node_modules/**"
    - "!dist/**"
    - "!build/**"
    - "!*.lock"
    - "!*.min.js"
    - "!*.min.css"

  # Language-specific settings
  path_instructions:
    - path: "**/*.ts"
      instructions: |
        Review TypeScript files for:
        - Proper type safety and avoid using `any`
        - Correct use of async/await and error handling
        - Chrome extension API best practices
    - path: "**/*.tsx"
      instructions: |
        Review React/TSX files for:
        - React best practices and hook usage
        - Accessibility (a11y) considerations
        - Performance (avoid unnecessary re-renders)
    - path: "my-ai-extension/**"
      instructions: |
        This is a Chrome browser extension project using:
        - React + TypeScript for the side panel UI
        - Vite as the build tool
        - Multiple AI model integrations
        Ensure Chrome extension Manifest V3 compliance.

chat:
  auto_reply: true
